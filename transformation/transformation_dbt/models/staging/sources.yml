version: 2

sources:
  - name: bronze
    database: DB_ERP
    schema: BRONZE

    tables:
      - name: distribution_centers
        description: "Distribution centers from the source system"
        columns:
          - name: id
            description: "Primary key of the distribution center"
            tests:
              - unique
              - not_null
          - name: name
            description: "Distribution center name"
          - name: latitude
          - name: longitude
          - name: distribution_center_geom

      - name: inventory_items
        description: "Individual inventory items"
        columns:
          - name: id
            description: "Primary key of the inventory item"
          - name: product_id
            description: "Foreign key to products"
          - name: created_at
          - name: sold_at
          - name: cost
          - name: product_category
          - name: product_name
          - name: product_brand
          - name: product_retail_price
          - name: product_department
          - name: product_sku
          - name: product_distribution_center_id
            tests:
              - relationships:
                  to: source('bronze', 'distribution_centers')
                  field: id
            description: "Foreign key to distribution centers"

      - name: orders_items
        identifier: ORDERS_ITEMS
        description: "Individual items associated with orders"
        columns:
          - name: id
            description: "Primary key of the order item"
            tests: 
              - unique
              - not_null
          - name: order_id
          - name: user_id
            description: "Foreign key to users"
            tests:
              - relationships:
                  to: source('bronze', 'users')
                  field: id
          - name: product_id
            description: "Foreign key to products"
            tests:
              - relationships:
                  to: source('bronze', 'products')
                  field: id
          - name: inventory_item_id
            description: "Foreign key to inventory items"
            tests:
              - relationships:
                  to: source('bronze', 'inventory_items')
                  field: id
          - name: status
          - name: created_at
          - name: shipped_at
          - name: delivered_at
          - name: returned_at
          - name: sale_price

      - name: products
        description: "Product master data"
        columns:
          - name: id
            description: "Primary key of the product"
            tests:
              - unique
              - not_null
          - name: cost
          - name: category
          - name: name
          - name: brand
          - name: retail_price
          - name: department
          - name: sku
          - name: distribution_center_id
            description: "Foreign key to distribution centers"

      - name: users
        description: "Customer/user master data"
        columns:
          - name: id
            description: "Primary key of the user"
            tests:
              - unique
              - not_null
          - name: first_name
          - name: last_name
          - name: email
          - name: age
          - name: gender
          - name: state
          - name: street_address
          - name: postal_code
          - name: city
          - name: country
          - name: latitude
          - name: longitude
          - name: traffic_source
          - name: created_at
          - name: user_geom